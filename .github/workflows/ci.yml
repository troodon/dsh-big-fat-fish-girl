name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      # The published package has one runtime dependency, the settings schema; the test
      # tooling is installed here only so the smoke test and the bundle build can run.
      - name: Install dependencies
        run: npm ci
      - name: Asset gate (manifest vs art)
        run: npm run verify
      - name: Browser bundle is up to date
        run: npm run build:check
      - name: Desktop page is up to date
        run: npm run build:desktop:check
      - name: Tests
        run: npm test
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Rendered artwork matches committed previews
        run: |
          python3 -m pip install --quiet --requirement scripts/preview-requirements.txt
          PREVIEW_TESTS_REQUIRE_PILLOW=1 node --test test/preview-art.test.mjs
          node scripts/build-preview.mjs --check

  shell-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Shell core geometry and alpha tests
        run: cargo test --manifest-path desktop/tauri/Cargo.toml -p big-fat-fish-girl-shell-core

  shell-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci
      - name: JavaScript checks
        run: npm run check
      - name: Shell core tests
        run: npm run test:core
      - name: Native shell tests (including Windows mutex)
        run: cargo test --manifest-path desktop/tauri/Cargo.toml -p big-fat-fish-girl-shell
      - name: Build release shell executable
        run: cargo build --manifest-path desktop/tauri/Cargo.toml -p big-fat-fish-girl-shell --release
      - name: Upload release shell executable
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-shell-exe
          path: desktop/tauri/target/release/big-fat-fish-girl-shell.exe
          if-no-files-found: error
          retention-days: 14
      - name: Native window startup and bridge
        run: npm run test:shell-startup
      - name: Install Tauri CLI for NSIS packaging
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "^2.0.0" --locked
          }
      - name: Build current-user NSIS installer
        run: npm run build:tauri:windows
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-shell-nsis
          path: desktop/tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  shell-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build the Tauri shell
        run: npm run build:tauri:binary
      - name: Native window startup and bridge
        run: npm run test:shell-startup
