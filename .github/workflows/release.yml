name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check release tag matches the package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            assert.equal(process.env.RELEASE_TAG, `v${version}`, "release tag must match package.json");
          '
      - name: Install dependencies
        run: npm ci
      - name: Gates
        run: npm run check
      - name: Pack the plugin
        run: |
          mkdir -p release-assets
          npm run pack -- release-assets
      - name: Upload the checked plugin
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-plugin
          path: release-assets/*.tgz
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'require("node:assert/strict").equal(process.arch, process.env.EXPECTED_ARCH)'
      - name: Run native tests
        run: cargo test --manifest-path desktop/tauri/Cargo.toml --workspace --locked
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.1 --locked
      - name: Build the macOS app
        working-directory: desktop/tauri
        run: cargo tauri build --ci --bundles app -- --locked
      - name: Ad-hoc sign and archive the app
        run: >-
          node scripts/package-macos.mjs
          'desktop/tauri/target/release/bundle/macos/Big Fat Fish Girl Shell.app'
          desktop/tauri/target/release-assets
      - name: Smoke-test the extracted release app
        run: |
          extracted="$RUNNER_TEMP/bffg-release-smoke"
          mkdir -p "$extracted"
          for archive in desktop/tauri/target/release-assets/*.zip; do
            ditto -x -k "$archive" "$extracted"
          done
          app="$extracted/Big Fat Fish Girl Shell.app"
          codesign --verify --deep --strict "$app"
          node scripts/verify-shell-startup.mjs "$app/Contents/MacOS/big-fat-fish-girl-shell"
      - name: Upload the verified macOS archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            desktop/tauri/target/release-assets/*.zip
            desktop/tauri/target/release-assets/*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [verify, macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify app checksums and hash all downloads
        working-directory: release-assets
        run: |
          sha256sum --check -- *.zip.sha256
          sha256sum -- *.tgz *.zip > SHA256SUMS
      - name: Publish the checked release files
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            release-assets/*.tgz
            release-assets/*.zip
            release-assets/*.zip.sha256
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Install the same-version Harness plugin and macOS app using the [installation guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/INSTALL.md).

            Choose `macos-arm64` for Apple Silicon or `macos-x64` for Intel. The app archives are ad-hoc signed, not Developer ID signed or notarized. Gatekeeper may require user approval; GitHub does not supply an Apple distribution signature. Building locally from this release's source tag is the alternative.

            Verify downloads against `SHA256SUMS`. Checksums detect file changes; they do not establish publisher identity. Windows builds are untested and are not included in these release files.
